name: Deploy SeaFlow project-control review

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare the allowlisted locale-consistent six-page deployment directory
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp history.html _site/history.html
          cp project-control.html _site/project-control.html
          cp en.html _site/en.html
          cp project-control.en.html _site/project-control.en.html
          cp history.en.html _site/history.en.html
          cp fonts.css _site/fonts.css
          touch _site/.nojekyll
          cmp --silent index.html _site/index.html
          cmp --silent history.html _site/history.html
          cmp --silent project-control.html _site/project-control.html
          cmp --silent en.html _site/en.html
          cmp --silent project-control.en.html _site/project-control.en.html
          cmp --silent history.en.html _site/history.en.html
          cmp --silent fonts.css _site/fonts.css
          test "$(find _site -maxdepth 1 -type f | wc -l)" -eq 8
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
